<!doctype html>
<html lang="uk">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Startup Spark — AI-генератор ідей</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <main class="shell">
    <header>
      <span class="eyebrow">НАВЧАЛЬНИЙ AI-ПРОЄКТ</span>
      <h1>Від ідеї до <em>стартапу</em></h1>
      <p>Обери сферу — і штучний інтелект придумає назву, ідею та слоган.</p>
    </header>
    <section class="panel" aria-label="Генерація ідеї">
      <form id="ideaForm">
        <label for="topic">Сфера стартапу</label>
        <select id="topic" name="topic">
          <option value="education">🎓 Освіта</option>
          <option value="health">💚 Здоров’я</option>
          <option value="games">🎮 Ігри</option>
        </select>
        <button id="generate" type="submit">✦ Згенерувати ідею</button>
      </form>
      <p id="status" role="status" aria-live="polite"></p>
    </section>
    <section id="result" class="idea-card" hidden aria-label="Згенерована ідея">
      <div class="badge">НОВА ІДЕЯ</div>
      <h2 id="name"></h2>
      <p id="slogan" class="slogan"></p>
      <div class="divider"></div>
      <h3>Що це за стартап?</h3>
      <p id="idea"></p>
    </section>
    <footer>Startup Spark · Gemini API · Навчальний вебзастосунок</footer>
  </main>
<script>
const form = document.getElementById('ideaForm');
const button = document.getElementById('generate');
const statusEl = document.getElementById('status');
const result = document.getElementById('result');
form.addEventListener('submit', async (event) => {
  event.preventDefault();
  button.disabled = true;
  statusEl.textContent = 'Генеруємо ідею…';
  result.hidden = true;
  try {
    const response = await fetch('/generate', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({topic: document.getElementById('topic').value})
    });
    const data = await response.json();
    if (!response.ok) throw new Error(data.error || 'Помилка сервера.');
    // textContent не виконує HTML, отриманий із моделі.
    document.getElementById('name').textContent = data.name;
    document.getElementById('slogan').textContent = data.slogan;
    document.getElementById('idea').textContent = data.idea;
    result.hidden = false;
    statusEl.textContent = 'Ідею успішно згенеровано.';
  } catch (error) {
    statusEl.textContent = error.message;
  } finally {
    button.disabled = false;
  }
});
</script>
</body>
</html>
